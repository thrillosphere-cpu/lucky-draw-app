<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw Pro - Raffle Winner Picker</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c3aed">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#f8f5ff;min-height:100vh}
.card{max-width:720px;margin:20px auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(124,58,237,.15)}
.tab{display:flex;gap:8px;margin:12px 0}
.tab button{flex:1;padding:10px;border-radius:12px;border:1px solid #e9d5ff;background:#f5f3ff;font-weight:600;cursor:pointer}
.tab button.active{background:#7c3aed;color:#fff}
#winnerArea{font-size:42px;font-weight:900;text-align:center;padding:40px 0;color:#7c3aed;min-height:120px}
.btn{width:100%;padding:16px;border-radius:14px;border:0;background:#7c3aed;color:#fff;font-weight:800;font-size:18px;cursor:pointer}
.btn:disabled{opacity:.5}
.list{margin-top:16px;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1 style="text-align:center">🎉 Lucky Draw Pro</h1>
<div class="tab">
<button class="active" onclick="switchTab('manual')">Manual</button>
<button onclick="switchTab('excel')">Excel</button>
</div>
<div id="tab-manual"><textarea id="inputNames" rows="5" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd" placeholder="Enter names, one per line"></textarea></div>
<div id="tab-excel" style="display:none"><input type="file" id="excelFile" accept=".xlsx,.xls,.csv"/><div id="sheetSelect"></div><div id="preview"></div></div>
<div style="margin-top:12px;display:flex;gap:8px">
<select id="winCount" style="padding:12px;border-radius:10px"><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option></select>
<button class="btn" id="drawBtn" onclick="startDraw()">START DRAW</button>
</div>
<div id="winnerArea">Ready?</div>
<div class="list"><strong>Participants: <span id="count">0</span></strong><div id="history"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
let participants=[],winners=JSON.parse(localStorage.getItem('ld_winners')||'[]'),isSpinning=false,lastPicked=[],audioCtx;
function getSecureRandomInt(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTick(f=900){try{ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.15,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.1);o.start();o.stop(audioCtx.currentTime+.1)}catch(e){}}
function switchTab(t){document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.getElementById('tab-manual').style.display=t=='manual'?'block':'none';document.getElementById('tab-excel').style.display=t=='excel'?'block':'none'}
function updateCount(){document.getElementById('count').textContent=getPool().length}
function getPool(){let ex=document.getElementById('inputNames').value.split('\n').map(s=>s.trim()).filter(Boolean);if(window._d&&window._d.length)ex=window._d;return ex.filter(n=>!winners.includes(n))}
function startDraw(){if(isSpinning)return;let pool=getPool();if(pool.length==0){alert('Add participants first');return}let count=parseInt(document.getElementById('winCount').value);isSpinning=true;document.getElementById('drawBtn').disabled=true;let el=document.getElementById('winnerArea');let i=0,total=30;let int=setInterval(()=>{el.textContent=pool[getSecureRandomInt(pool.length)];playTick(600+i*10);i++;if(i>=total){clearInterval(int);finish(pool,count)}},80)}
function finish(pool,count){isSpinning=false;document.getElementById('drawBtn').disabled=false;let picked=[];let temp=[...pool];for(let k=0;k<count&&temp.length>0;k++){let idx=getSecureRandomInt(temp.length);picked.push(temp[idx]);temp.splice(idx,1)}lastPicked=picked;winners=[...winners,...picked];localStorage.setItem('ld_winners',JSON.stringify(winners));document.getElementById('winnerArea').innerHTML=picked.map(p=>`<div>🏆 ${p}</div>`).join('');renderHistory();updateCount()}
function renderHistory(){document.getElementById('history').innerHTML=winners.slice().reverse().map(w=>`• ${w}`).join('<br>');}
renderHistory();updateCount();
document.getElementById('inputNames').addEventListener('input',updateCount);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>

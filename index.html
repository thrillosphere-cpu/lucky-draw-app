<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw Pro - Raffle Winner Picker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" href="icon-512.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{--p:#7c3aed;--p2:#ec4899;--ok:#10b981}
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:linear-gradient(135deg,#f8f5ff,#ffe4f0);min-height:100vh}
.container{max-width:520px;margin:0 auto;padding:14px}
.header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:24px;padding:18px;text-align:center}
.card{background:#fff;border-radius:20px;padding:14px;margin-top:14px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:12px;border:1.5px solid #e5e7eb;background:#f9fafb;text-align:center;cursor:pointer;font-weight:700;font-size:12px}
.tab.active{background:var(--p);color:#fff}
textarea,input,select{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:11px;font-size:14px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:800;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.row{display:flex;gap:8px}
.badge{background:#ede9fe;color:var(--p);padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800}
.display{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:900;text-align:center;background:radial-gradient(circle,#fef3c7,#fde68a);border-radius:16px;margin:12px 0;border:2px dashed #f59e0b;color:#92400e}
.display.spinning{animation:shake .08s infinite}
@keyframes shake{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
.winner-card{background:linear-gradient(135deg,var(--ok),#059669);color:#fff;border-radius:16px;padding:16px;text-align:center;margin-top:12px}
.file-drop{border:2px dashed #c4b5fd;border-radius:12px;padding:18px;text-align:center;background:#f5f3ff;cursor:pointer}
.preview{max-height:160px;overflow:auto;border:1px solid #e5e7eb;border-radius:10px;margin-top:8px}
.preview table{width:100%;border-collapse:collapse;font-size:12px}
.opt{display:flex;gap:6px;align-items:center;font-size:12px;background:#f9fafb;padding:8px 10px;border-radius:10px;border:1px solid #e5e7eb}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🎉 Lucky Draw Pro - Raffle Winner Picker</h1><div style="font-size:12px">Android Ready • Crypto-secure • 15s Animation</div><div style="margin-top:8px"><span class="badge" style="background:#fff;color:var(--p)" id="pCount">0 participants</span></div></div>
<div class="card"><div class="tabs"><div class="tab active" onclick="switchTab('manual')">Manual</div><div class="tab" onclick="switchTab('file')">Excel</div><div class="tab" onclick="switchTab('history')">History</div></div>
<div id="manualTab"><textarea id="nameInput" rows="5" placeholder="One name per line"></textarea><div class="row" style="margin-top:8px"><div class="opt"><input type="radio" name="dup" value="remove" checked> Remove dup</div><div class="opt"><input type="radio" name="dup" value="keep"> Keep</div></div><button class="btn btn-primary" style="margin-top:10px" onclick="addManual()">Add to List</button></div>
<div id="fileTab" style="display:none"><div class="file-drop" onclick="document.getElementById('fileInput').click()">📁 Upload Excel/CSV<input type="file" id="fileInput" hidden accept=".xlsx,.xls,.csv,.txt" onchange="handleFile(event)"></div><div id="excelControls" style="display:none;margin-top:10px"><div class="row"><div style="flex:1"><small>Sheet</small><select id="sheetSelect" onchange="onSheetChange()"></select></div><div style="flex:1"><small>Column</small><select id="colSelect" onchange="renderPreview()"></select></div></div><div class="preview" id="previewBox"></div><button class="btn" style="background:#ede9fe;color:var(--p);margin-top:8px" onclick="confirmImport()">✔ Confirm Import</button></div><div id="fileStatus" style="font-size:12px;text-align:center;margin-top:8px">No file</div></div>
<div id="historyTab" style="display:none"><div class="opt"><input type="checkbox" id="excludePrev" checked> Exclude previous winners</div><div id="historyList"></div></div>
</div>
<div class="card"><div class="display" id="display"><span id="displayText">Ready to Draw</span><span id="timer" style="font-size:11px"></span></div><div class="row"><div style="width:90px"><input id="winnerCount" type="number" value="1" min="1"></div><div style="flex:1"><button class="btn btn-primary" id="spinBtn" onclick="startDraw(false)">🎲 SPIN 15s</button></div></div><div class="row" style="margin-top:8px"><button class="btn" style="background:#ede9fe;color:var(--p);flex:1" id="againBtn" onclick="startDraw(true)" disabled>↻ Draw Again</button><button class="btn" style="background:#fef3c7;color:#92400e;flex:1" id="replayBtn" onclick="replayAnimation()" disabled>▶ Replay</button></div></div>
<div id="winnerArea"></div>
</div>
<script>
let participants=[],winners=JSON.parse(localStorage.getItem('ld_winners_v2')||'[]'),workbook=null,rawData=[],lastPicked=[],isSpinning=false,audioCtx=null;
function getSecureRandomInt(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max;}
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTick(f=900){try{ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.07);o.stop(audioCtx.currentTime+0.07);}catch(e){}}
function switchTab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));['manualTab','fileTab','historyTab'].forEach(id=>document.getElementById(id).style.display='none');let m={manual:0,file:1,history:2}[t];document.querySelectorAll('.tab')[m].classList.add('active');document.getElementById(t+'Tab').style.display='block';renderHistory();}
function updateCount(){document.getElementById('pCount').textContent=participants.length+' participants';}
function addManual(){let txt=document.getElementById('nameInput').value.trim();if(!txt)return;let names=txt.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);participants=[...new Set([...participants,...names])].slice(0,500);document.getElementById('nameInput').value='';updateCount();}
function handleFile(e){const file=e.target.files[0];if(!file)return;document.getElementById('fileStatus').textContent='Reading '+file.name;const ext=file.name.split('.').pop().toLowerCase();if(ext==='txt'||ext==='csv'){const r=new FileReader();r.onload=ev=>{rawData=ev.target.result.split(/\r?\n/).map(r=>r.split(','));workbook=null;setupExcelControls();};r.readAsText(file);}else{const r=new FileReader();r.onload=ev=>{workbook=XLSX.read(ev.target.result,{type:'binary'});setupExcelControls();};r.readAsBinaryString(file);}}
function setupExcelControls(){const sel=document.getElementById('sheetSelect');sel.innerHTML='';if(workbook){workbook.SheetNames.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});}else{let o=document.createElement('option');o.value='S';o.textContent='CSV';sel.appendChild(o);}document.getElementById('excelControls').style.display='block';onSheetChange();}
function onSheetChange(){let data=[];if(workbook){data=XLSX.utils.sheet_to_json(workbook.Sheets[document.getElementById('sheetSelect').value],{header:1});}else{data=rawData;}window._d=data;const colSel=document.getElementById('colSelect');colSel.innerHTML='';let max=Math.max(...data.map(r=>r.length));for(let i=0;i<max;i++){let o=document.createElement('option');o.value=i;o.textContent='Column '+(i+1);colSel.appendChild(o);}renderPreview();}
function renderPreview(){const data=window._d||[];const c=parseInt(document.getElementById('colSelect').value||0);let html='<table>';for(let i=0;i<Math.min(10,data.length);i++){let v=data[i]&&data[i][c]?String(data[i][c]):'';html+='<tr><td>'+v+'</td></tr>';}html+='</table>';document.getElementById('previewBox').innerHTML=html;}
function confirmImport(){const data=window._d||[];const c=parseInt(document.getElementById('colSelect').value||0);let names=data.map(r=>r[c]?String(r[c]).trim():'').filter(Boolean);participants=[...new Set([...participants,...names])].slice(0,500);updateCount();document.getElementById('fileStatus').textContent='Imported '+names.length;document.getElementById('excelControls').style.display='none';}
function getPool(){let ex=document.getElementById('excludePrev').checked;if(!ex)return participants;let s=new Set(winners.map(w=>w.name));return participants.filter(p=>!s.has(p));}
function startDraw(again){if(isSpinning)return;let pool=again?getPool():participants;if(pool.length==0)return alert('Add participants');let count=parseInt(document.getElementById('winnerCount').value)||1;if(count>pool.length)count=pool.length;isSpinning=true;document.getElementById('spinBtn').disabled=true;const d=document.getElementById('display');d.classList.add('spinning');let el=0;let t=setInterval(()=>playTick(800+getSecureRandomInt(400)),120);let iv=setInterval(()=>{el+=80;document.getElementById('displayText').textContent=pool[getSecureRandomInt(pool.length)];document.getElementById('timer').textContent=((15000-el)/1000).toFixed(1)+'s';if(el>=15000){clearInterval(iv);clearInterval(t);finish(pool,count);}},80);}
function finish(pool,count){isSpinning=false;document.getElementById('display').classList.remove('spinning');let temp=[...pool],picked=[];for(let i=0;i<count;i++){picked.push(temp.splice(getSecureRandomInt(temp.length),1)[0]);}lastPicked=picked;document.getElementById('displayText').textContent=picked[0];if(window.confetti)confetti({particleCount:180,spread:90});document.getElementById('winnerArea').innerHTML='<div class="winner-card">🏆 '+picked.join('<br>🏆 ')+'</div>';picked.forEach(n=>winners.unshift({name:n,time:new Date().toLocaleString()}));localStorage.setItem('ld_winners_v2',JSON.stringify(winners));document.getElementById('spinBtn').disabled=false;document.getElementById('againBtn').disabled=false;document.getElementById('replayBtn').disabled=false;renderHistory();}
function replayAnimation(){if(!lastPicked.length)return;if(isSpinning)return;isSpinning=true;let el=0;let iv=setInterval(()=>{el+=80;document.getElementById('displayText').textContent=participants[getSecureRandomInt(participants.length)]||lastPicked[0];if(el>=8000){clearInterval(iv);isSpinning=false;document.getElementById('displayText').textContent=lastPicked[0];if(window.confetti)confetti({particleCount:120});}},80);}
function renderHistory(){document.getElementById('historyList').innerHTML=winners.map(w=>'🏆 '+w.name+'<br>').join('')||'No winners';}
renderHistory();updateCount();
</script>
</body>
</html>
